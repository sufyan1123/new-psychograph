<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PsychoGraph — Chat Analysis Dashboard</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400;500&display=swap');

  :root {
    --bg: #0e0f11;
    --surface: #16181c;
    --surface2: #1e2128;
    --border: #2a2d35;
    --accent: #c8f04f;
    --accent2: #f04f8a;
    --accent3: #4fc8f0;
    --text: #e8eaf0;
    --muted: #6b7280;
    --warn: #f0a44f;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    min-height: 100vh;
  }

  /* ── Header ── */
  header {
    border-bottom: 1px solid var(--border);
    padding: 24px 40px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--surface);
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .logo {
    font-family: 'DM Serif Display', serif;
    font-size: 22px;
    letter-spacing: -0.5px;
    color: var(--accent);
  }
  .logo span { color: var(--text); }

  .header-meta {
    color: var(--muted);
    font-size: 11px;
  }

  /* ── Layout ── */
  .app { display: flex; height: calc(100vh - 65px); }

  /* Sidebar */
  .sidebar {
    width: 240px;
    border-right: 1px solid var(--border);
    background: var(--surface);
    overflow-y: auto;
    flex-shrink: 0;
  }

  .sidebar-section {
    padding: 16px;
    border-bottom: 1px solid var(--border);
  }

  .sidebar-label {
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 10px;
  }

  .participant-btn {
    display: block;
    width: 100%;
    text-align: left;
    padding: 10px 12px;
    border-radius: 6px;
    border: 1px solid transparent;
    background: none;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.15s;
    margin-bottom: 4px;
  }

  .participant-btn:hover { background: var(--surface2); border-color: var(--border); }
  .participant-btn.active { background: var(--surface2); border-color: var(--accent); color: var(--accent); }

  .participant-btn .msg-count {
    float: right;
    font-size: 10px;
    color: var(--muted);
  }

  /* Main content */
  .main {
    flex: 1;
    overflow-y: auto;
    padding: 32px 40px;
  }

  /* Upload zone */
  .upload-zone {
    border: 2px dashed var(--border);
    border-radius: 12px;
    padding: 60px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    margin-bottom: 32px;
  }

  .upload-zone:hover { border-color: var(--accent); background: rgba(200,240,79,0.03); }
  .upload-zone.dragover { border-color: var(--accent); background: rgba(200,240,79,0.06); }

  .upload-icon { font-size: 36px; margin-bottom: 12px; }
  .upload-title { font-family: 'DM Serif Display', serif; font-size: 18px; margin-bottom: 8px; }
  .upload-sub { color: var(--muted); font-size: 11px; line-height: 1.6; }

  .btn {
    display: inline-block;
    padding: 10px 20px;
    border-radius: 6px;
    border: none;
    cursor: pointer;
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    font-weight: 500;
    transition: all 0.15s;
  }

  .btn-primary { background: var(--accent); color: #0e0f11; }
  .btn-primary:hover { background: #d4f566; }
  .btn-demo { background: var(--surface2); color: var(--text); border: 1px solid var(--border); margin-left: 10px; }
  .btn-demo:hover { border-color: var(--accent3); color: var(--accent3); }

  /* Patient header */
  .patient-header {
    margin-bottom: 28px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--border);
  }

  .patient-name {
    font-family: 'DM Serif Display', serif;
    font-size: 28px;
    margin-bottom: 4px;
  }

  .patient-sub { color: var(--muted); }

  /* Section titles */
  .section-title {
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 16px;
    margin-top: 32px;
  }

  /* KPI Grid */
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 12px;
    margin-bottom: 8px;
  }

  .kpi-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    transition: border-color 0.15s;
  }

  .kpi-card:hover { border-color: var(--accent3); }

  .kpi-name {
    font-size: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
  }

  .kpi-score {
    font-family: 'DM Serif Display', serif;
    font-size: 32px;
    line-height: 1;
    margin-bottom: 8px;
  }

  .kpi-bar {
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
    margin-bottom: 8px;
  }

  .kpi-fill {
    height: 100%;
    border-radius: 2px;
    transition: width 0.8s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .kpi-rationale { color: var(--muted); font-size: 11px; line-height: 1.5; }

  /* Defense Mechanism Grid */
  .defense-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 10px;
  }

  .defense-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px;
    display: flex;
    gap: 12px;
    align-items: flex-start;
  }

  .defense-card.active { border-color: var(--accent2); }

  .defense-count {
    font-family: 'DM Serif Display', serif;
    font-size: 28px;
    color: var(--muted);
    line-height: 1;
    flex-shrink: 0;
    width: 36px;
    text-align: center;
  }

  .defense-card.active .defense-count { color: var(--accent2); }

  .defense-info { flex: 1; }

  .defense-name {
    font-size: 11px;
    text-transform: capitalize;
    margin-bottom: 4px;
    font-weight: 500;
  }

  .defense-example {
    font-size: 10px;
    color: var(--muted);
    line-height: 1.5;
    font-style: italic;
  }

  /* Dominant tag */
  .dominant-tag {
    display: inline-block;
    padding: 4px 10px;
    border-radius: 20px;
    background: rgba(240, 79, 138, 0.15);
    border: 1px solid var(--accent2);
    color: var(--accent2);
    font-size: 11px;
    margin-bottom: 16px;
    text-transform: capitalize;
  }

  /* Summary cards */
  .summary-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 16px;
  }

  .summary-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
  }

  .summary-card-title {
    font-size: 10px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 12px;
  }

  .tag-list { display: flex; flex-wrap: wrap; gap: 6px; }

  .tag {
    padding: 4px 10px;
    border-radius: 4px;
    font-size: 11px;
    border: 1px solid;
  }

  .tag-green { background: rgba(200,240,79,0.08); border-color: var(--accent); color: var(--accent); }
  .tag-red { background: rgba(240,79,138,0.08); border-color: var(--accent2); color: var(--accent2); }
  .tag-blue { background: rgba(79,200,240,0.08); border-color: var(--accent3); color: var(--accent3); }
  .tag-warn { background: rgba(240,164,79,0.08); border-color: var(--warn); color: var(--warn); }

  /* Clinical notes */
  .clinical-notes {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent3);
    border-radius: 0 10px 10px 0;
    padding: 20px;
    font-size: 13px;
    line-height: 1.7;
    color: var(--text);
    margin-bottom: 16px;
  }

  /* Health score */
  .health-score-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
    display: flex;
    align-items: center;
    gap: 20px;
    margin-bottom: 24px;
  }

  .health-circle {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'DM Serif Display', serif;
    font-size: 28px;
    flex-shrink: 0;
    border: 3px solid;
  }

  .health-info h3 {
    font-family: 'DM Serif Display', serif;
    font-size: 18px;
    margin-bottom: 4px;
  }

  .health-info p { color: var(--muted); font-size: 12px; line-height: 1.5; }

  /* Flag */
  .flag-banner {
    background: rgba(240, 164, 79, 0.08);
    border: 1px solid var(--warn);
    border-radius: 8px;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 20px;
    font-size: 12px;
    color: var(--warn);
  }

  /* Relationship dynamic */
  .dynamic-pill {
    display: inline-block;
    padding: 6px 14px;
    border-radius: 20px;
    background: rgba(79,200,240,0.1);
    border: 1px solid var(--accent3);
    color: var(--accent3);
    font-size: 12px;
    margin-bottom: 16px;
  }

  /* Empty / loading states */
  .empty-state {
    text-align: center;
    padding: 80px 40px;
    color: var(--muted);
  }

  .empty-state .big { font-family: 'DM Serif Display', serif; font-size: 20px; color: var(--text); margin-bottom: 8px; }

  .loader { animation: pulse 1.5s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 0.4; } 50% { opacity: 1; } }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  /* Fade in */
  .fade-in { animation: fadeIn 0.4s ease forwards; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>

<header>
  <div class="logo">Psycho<span>Graph</span></div>
  <div class="header-meta" id="headerMeta">Chat Intelligence · Mental Health Analysis</div>
</header>

<div class="app">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-section">
      <div class="sidebar-label">Conversations</div>
      <div id="participantList">
        <div style="color: var(--muted); font-size: 11px; padding: 8px 0;">No data loaded</div>
      </div>
    </div>
  </aside>

  <!-- Main -->
  <main class="main" id="mainContent">
    <!-- Upload -->
    <div class="upload-zone" id="uploadZone">
      <div class="upload-icon">🧠</div>
      <div class="upload-title">Upload Instagram Export</div>
      <div class="upload-sub">
        Upload a <strong>.json</strong> file (single conversation) or <strong>.zip</strong> file (full export)<br>
        The server will analyze it with Claude AI and show results here
      </div>
      <br>
      <input type="file" id="fileInput" accept=".json,.zip" style="display:none">
      <button class="btn btn-primary" onclick="document.getElementById('fileInput').click()">Upload File</button>
      <button class="btn btn-demo" onclick="loadDemo()">Load Demo Data</button>
    </div>

    <div id="analysisView" style="display:none"></div>
  </main>
</div>

<script>
// ── Demo Data ────────────────────────────────────────────────────────────────
const DEMO_DATA = {
  patient_name: "Patient",
  conversations: {
    "Alex": {
      message_count: 8,
      defense_mechanisms: {

          intellectualization: { count: 0, example: null },
          repression: { count: 0, example: null },
          displacement: { count: 0, example: null },
          passive_aggression: { count: 1, example: "you're overreacting as always" },
          splitting: { count: 0, example: null },
          minimization: { count: 1, example: "It's literally not a big deal" }
        },

        dominant_mechanism: "deflection"
      },
      kpis: {
        kpis: {
          emotional_openness: { score: 2, rationale: "Patient consistently refuses to acknowledge emotional distress." },
          vulnerability: { score: 1, rationale: "No vulnerability expressed; all attempts to connect are deflected." },
          conflict_avoidance: { score: 8, rationale: "Patient changes subject and minimizes concerns to avoid conflict." },
          empathy_shown: { score: 3, rationale: "Limited empathy; focuses on self-defense rather than other's concern." },
          self_awareness: { score: 2, rationale: "Patient rationalizes behavior without recognizing its impact." },
          communication_clarity: { score: 5, rationale: "Messages are clear but evasive in emotional content." },
          emotional_reactivity: { score: 7, rationale: "Responds defensively when emotional topics arise." }
        },
        overall_health_score: 3,
        flag_for_review: true,
        flag_reason: "Significant emotional avoidance and use of defense mechanisms in response to expressed concern."
      },
      qualitative_summary: {
        relationship_dynamic: "Caretaker-avoider dynamic — Alex expresses concern, patient deflects",
        behavioral_patterns: [
          "Consistent topic-switching when emotions arise",
          "Minimizing others' concerns as 'overreacting'",
          "Using projection to deflect accountability"
        ],
        red_flags: [
          "Refusal to acknowledge any emotional difficulty",
          "Labeling concerned friend as 'overreacting'"
        ],
        strengths: [
          "Maintains the relationship despite defensiveness",
          "Does not escalate to hostility"
        ],
        therapy_suggestions: [
          "Explore resistance to showing vulnerability",
          "Examine the function of humor and deflection as coping",
          "Discuss origins of difficulty accepting concern from others"
        ],
        clinical_notes: "Patient demonstrates a consistent pattern of emotional avoidance when confronted with expressions of care or concern. The use of projection and minimization suggests difficulty tolerating vulnerability. This may warrant exploration of attachment style and early relational experiences."
      }
    },
    "Jordan": {
      message_count: 6,
      defense_mechanisms: {
        defense_mechanisms: {
          denial: { count: 2, example: "I'm totally fine, everything is great" },
          projection: { count: 0, example: null },
          rationalization: { count: 1, example: "people exaggerate" },
          deflection: { count: 0, example: null },
          intellectualization: { count: 0, example: null },
          repression: { count: 0, example: null },
          displacement: { count: 0, example: null },
          passive_aggression: { count: 0, example: null },
          splitting: { count: 0, example: null },
          minimization: { count: 1, example: "Who told you that? people exaggerate" }
        },
        total_defense_events: 4,
        dominant_mechanism: "denial"
      },
      kpis: {
        kpis: {
          emotional_openness: { score: 3, rationale: "Patient presents a positive facade inconsistent with reported difficulties." },
          vulnerability: { score: 2, rationale: "No vulnerability expressed even when directly asked." },
          conflict_avoidance: { score: 6, rationale: "Deflects concern by questioning the source of information." },
          empathy_shown: { score: 6, rationale: "More socially engaged, warmer tone than with Alex." },
          self_awareness: { score: 3, rationale: "Attributes others' concern to exaggeration rather than self-reflection." },
          communication_clarity: { score: 7, rationale: "Clear communication in social context, evasive about personal matters." },
          emotional_reactivity: { score: 4, rationale: "Less reactive than with Alex; maintains composed social mask." }
        },
        overall_health_score: 5,
        flag_for_review: false,
        flag_reason: null
      },
      qualitative_summary: {
        relationship_dynamic: "Social acquaintance dynamic — patient maintains positive social persona",
        behavioral_patterns: [
          "Presents very differently in social vs. close relationships",
          "Uses enthusiasm to mask underlying distress",
          "Quickly dismisses any suggestion of difficulty"
        ],
        red_flags: [],
        strengths: [
          "Maintains social connections",
          "Capable of positive engagement",
          "Less defensive than in closer relationships"
        ],
        therapy_suggestions: [
          "Explore the gap between public persona and private emotional state",
          "Discuss the energy required to maintain a positive facade",
          "Consider social anxiety or fear of judgment as underlying factors"
        ],
        clinical_notes: "Patient presents a markedly more positive and socially engaged persona in this relationship compared to closer connections. The contrast suggests possible compartmentalization and a fear of being perceived as struggling. The social mask appears functional but may be emotionally costly."
      }
    }
  }
};

// ── State ────────────────────────────────────────────────────────────────────
let currentData = null;
let currentParticipant = null;

// ── Show a styled error in the upload zone instead of a browser alert ─────────
function showUploadError(message) {
  const zone = document.getElementById('uploadZone');
  // Save the original HTML so we can restore it
  const original = zone.innerHTML.replace(/`/g, '\\`');
  
  // Replace zone content with a styled error message
  zone.innerHTML = `
    <div style="color:var(--accent2);font-size:14px;margin-bottom:12px">⚠️ Upload Error</div>
    <div style="color:var(--text);font-size:12px;line-height:1.7;white-space:pre-wrap;text-align:left;background:var(--surface2);padding:16px;border-radius:8px;border:1px solid var(--accent2);max-width:520px;margin:0 auto">${message}</div>
    <br>
    <button class="btn btn-demo" onclick="location.reload()" style="margin-top:8px">← Try Again</button>
  `;
}

// ── API Configuration ─────────────────────────────────────────────────────────
// When running through server.py, the API is at the same domain
// When opening the HTML directly, you'd need to specify http://127.0.0.1:8000
const API_URL = window.location.origin === "null" || window.location.origin === "file://"
  ? "http://127.0.0.1:8000/analyze"  // Opened HTML directly from filesystem
  : "/analyze";                       // Served through the FastAPI server

// ── Upload and analyze a file using the backend API ──────────────────────────
async function uploadAndAnalyze(file) {
  if (!file) return;

  // Show loading state in the header
  const headerMeta = document.getElementById('headerMeta');
  const originalText = headerMeta.textContent;
  headerMeta.textContent = "Analyzing with Claude AI...";
  headerMeta.style.color = "var(--accent)";

  // Show a loading overlay on the upload zone
  const uploadZone = document.getElementById('uploadZone');
  const originalZoneHTML = uploadZone.innerHTML;
  uploadZone.innerHTML = `
    <div class="loader" style="font-size:48px;margin-bottom:16px">🧠</div>
    <div style="font-family:'DM Serif Display',serif;font-size:18px;margin-bottom:8px">Analyzing your conversations...</div>
    <div style="color:var(--muted);font-size:11px">This may take 30-60 seconds per conversation</div>
  `;

  try {
    // Create FormData to send the file to the API
    const formData = new FormData();
    formData.append("file", file);

    // Make the POST request to the /analyze endpoint
    const response = await fetch(API_URL, {
      method: "POST",
      body: formData
    });

    // Check if the response was successful
    if (!response.ok) {
      const errorData = await response.json().catch(() => ({}));
      throw new Error(errorData.detail || `Server error: ${response.status}`);
    }

    // Parse the JSON response containing the analysis results
    const data = await response.json();
    
    // Load the data into the dashboard
    loadData(data);

  } catch (err) {
    // If something went wrong, show a detailed error message
    console.error("Analysis error:", err);
    
    let errorMessage = err.message || "Unknown error occurred";
    
    // Add helpful hints based on the error type
    if (errorMessage.includes("Failed to fetch")) {
      errorMessage = "Cannot connect to the API server.\n\nMake sure server.py is running:\n  python server.py\n\nThen refresh this page.";
    }
    
    showUploadError(errorMessage);
    
    // Restore the upload zone after showing the error
    setTimeout(() => {
      uploadZone.innerHTML = originalZoneHTML;
    }, 100);

  } finally {
    // Restore the header text and color
    headerMeta.textContent = originalText;
    headerMeta.style.color = "";
  }
}

// ── File input change handler ─────────────────────────────────────────────────
// Triggered when user clicks "Upload JSON" and selects a file
document.getElementById('fileInput').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  await uploadAndAnalyze(file);
  // Reset the input so the same file can be re-uploaded if needed
  e.target.value = '';
});

// ── Drag and drop handlers ────────────────────────────────────────────────────
// Allow users to drag and drop files onto the upload zone
const uploadZone = document.getElementById('uploadZone');

// Show visual feedback when dragging a file over the zone
uploadZone.addEventListener('dragover', (e) => {
  e.preventDefault();
  uploadZone.classList.add('dragover');
});

// Remove visual feedback when dragging away
uploadZone.addEventListener('dragleave', () => {
  uploadZone.classList.remove('dragover');
});

// Handle the file drop
uploadZone.addEventListener('drop', async (e) => {
  e.preventDefault();
  uploadZone.classList.remove('dragover');
  const file = e.dataTransfer.files[0];
  await uploadAndAnalyze(file);
});

// ── Demo button handler ───────────────────────────────────────────────────────
// Load built-in demo data without making an API call
function loadDemo() {
  loadData(DEMO_DATA);
}

// ── Load Data into the dashboard ──────────────────────────────────────────────
function loadData(data) {
  currentData = data;

  // Hide upload zone and show the analysis view
  document.getElementById('uploadZone').style.display = 'none';
  document.getElementById('analysisView').style.display = 'block';
  document.getElementById('headerMeta').textContent = `Patient: ${data.patient_name}`;

  // Show a banner if this was a raw Instagram import (not a full analysis)
  if (data._raw_import) {
    const banner = document.createElement('div');
    banner.style.cssText = 'background:rgba(240,164,79,0.1);border:1px solid var(--warn);border-radius:8px;padding:12px 16px;color:var(--warn);font-size:12px;margin-bottom:20px';
    banner.textContent = '⚠️ Raw Instagram import — scores are placeholders. Run analyzer.py to generate real analysis.';
    document.getElementById('analysisView').prepend(banner);
  }

  // Build sidebar and show the first conversation
  buildSidebar(data);
  const firstParticipant = Object.keys(data.conversations)[0];
  if (firstParticipant) showParticipant(firstParticipant);
}

// ── Sidebar ──────────────────────────────────────────────────────────────────
function buildSidebar(data) {
  const list = document.getElementById('participantList');
  list.innerHTML = '';
  for (const [name, conv] of Object.entries(data.conversations)) {
    const btn = document.createElement('button');
    btn.className = 'participant-btn';
    btn.innerHTML = `${name} <span class="msg-count">${conv.message_count || '?'}</span>`;
    btn.onclick = () => showParticipant(name);
    btn.id = `btn-${name}`;
    list.appendChild(btn);
  }
}

// ── Show Participant ─────────────────────────────────────────────────────────
function showParticipant(name) {
  currentParticipant = name;
  document.querySelectorAll('.participant-btn').forEach(b => b.classList.remove('active'));
  const btn = document.getElementById(`btn-${name}`);
  if (btn) btn.classList.add('active');

  const conv = currentData.conversations[name];
  const view = document.getElementById('analysisView');

  if (conv.error) {
    view.innerHTML = `<div class="empty-state"><div class="big">Analysis Error</div><p>${conv.error}</p></div>`;
    return;
  }

  const dm = conv.defense_mechanisms;
  const kpi = conv.kpis;
  const qs = conv.qualitative_summary;

  // ── Health Score ──
  const score = kpi.overall_health_score;
  const scoreColor = score >= 7 ? 'var(--accent)' : score >= 4 ? 'var(--warn)' : 'var(--accent2)';
  const scoreLabel = score >= 7 ? 'Healthy Communication' : score >= 4 ? 'Moderate Concerns' : 'Significant Concerns';

  // ── Build HTML ──
  let html = `<div class="fade-in">
    <div class="patient-header">
      <div class="patient-name">${currentData.patient_name} → ${name}</div>
      <div class="patient-sub">${conv.message_count} messages analyzed</div>
    </div>`;

  // Flag
  if (kpi.flag_for_review) {
    html += `<div class="flag-banner">⚠️ Flagged for clinical review — ${kpi.flag_reason}</div>`;
  }

  // Health score
  html += `<div class="health-score-card">
    <div class="health-circle" style="border-color:${scoreColor};color:${scoreColor}">${score}/10</div>
    <div class="health-info">
      <h3>${scoreLabel}</h3>
      <p>Overall communication health score for this relationship based on KPI analysis.</p>
    </div>
  </div>`;

  // ── KPIs ──
  html += `<div class="section-title">Communication KPIs</div><div class="kpi-grid">`;
  for (const [key, val] of Object.entries(kpi.kpis)) {
    const s = val.score;
    const c = s >= 7 ? '#c8f04f' : s >= 4 ? '#f0a44f' : '#f04f8a';
    html += `<div class="kpi-card">
      <div class="kpi-name">${key.replace(/_/g,' ')}</div>
      <div class="kpi-score" style="color:${c}">${s}</div>
      <div class="kpi-bar"><div class="kpi-fill" style="width:${s*10}%;background:${c}"></div></div>
      <div class="kpi-rationale">${val.rationale}</div>
    </div>`;
  }
  html += `</div>`;

  // ── Defense Mechanisms ──
  html += `<div class="section-title">Defense Mechanisms</div>`;
  if (dm.dominant_mechanism) {
    html += `<div>Dominant: <span class="dominant-tag">${dm.dominant_mechanism}</span> &nbsp; Total events: <strong>${dm.total_defense_events}</strong></div>`;
  }
  html += `<div class="defense-grid" style="margin-top:12px">`;
  for (const [key, val] of Object.entries(dm.defense_mechanisms)) {
    const active = val.count > 0 ? 'active' : '';
    html += `<div class="defense-card ${active}">
      <div class="defense-count">${val.count}</div>
      <div class="defense-info">
        <div class="defense-name">${key.replace(/_/g,' ')}</div>
        ${val.example ? `<div class="defense-example">"${val.example}"</div>` : ''}
      </div>
    </div>`;
  }
  html += `</div>`;

  // ── Qualitative Summary ──
  html += `<div class="section-title">Qualitative Summary</div>`;
  html += `<div class="dynamic-pill">🔗 ${qs.relationship_dynamic}</div>`;
  html += `<div class="clinical-notes">${qs.clinical_notes}</div>`;

  html += `<div class="summary-grid">`;

  html += `<div class="summary-card">
    <div class="summary-card-title">Behavioral Patterns</div>
    <div class="tag-list">${qs.behavioral_patterns.map(p => `<span class="tag tag-blue">${p}</span>`).join('')}</div>
  </div>`;

  html += `<div class="summary-card">
    <div class="summary-card-title">Strengths</div>
    <div class="tag-list">${qs.strengths.map(s => `<span class="tag tag-green">${s}</span>`).join('')}</div>
  </div>`;

  if (qs.red_flags.length > 0) {
    html += `<div class="summary-card">
      <div class="summary-card-title">Red Flags</div>
      <div class="tag-list">${qs.red_flags.map(r => `<span class="tag tag-red">${r}</span>`).join('')}</div>
    </div>`;
  }

  html += `<div class="summary-card">
    <div class="summary-card-title">Therapy Suggestions</div>
    <div class="tag-list">${qs.therapy_suggestions.map(t => `<span class="tag tag-warn">${t}</span>`).join('')}</div>
  </div>`;

  html += `</div></div>`; // close summary-grid + fade-in

  view.innerHTML = html;
}
</script>
</body>
</html>
